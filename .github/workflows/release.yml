name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the crate and GitHub release
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preview:
    name: Verify package
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify package
        run: cargo publish --dry-run

  publish:
    name: Publish, tag, and release
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Releases must be dispatched from $DEFAULT_BRANCH, not $GITHUB_REF." >&2
            exit 1
          fi

      - name: Verify package
        run: cargo publish --dry-run

      - name: Release
        uses: release-plz/action@v0.5
        with:
          command: release
          version: 0.3.171
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
